version: 1

setting:
  name: Hollow Bank First Contact
  biome: cypress swamp
  time_of_day: night
  season: late summer
  location_type: beaver spillway
  scale: river-otter
  objectives:
    - protect the spillway
    - keep the beaver colony safe
  tags:
    - moonlit
    - flooded
    - first-contact

simulation:
  tick_seconds: 2.0
  seed: 731994

environment:
  weather:
    description: Slow-changing atmospheric conditions.
    components:
      cloud_cover:
        initial: 0.28
        bounds: [0.0, 1.0]
        units: fraction
        dynamics:
          method: bounded_inertial
          max_delta: 0.05
          jitter: 0.015
          inertia: 0.90
          max_velocity: 0.04

      rain_intensity:
        initial: 0.0
        bounds: [0.0, 1.0]
        units: normalized
        dynamics:
          method: bounded_target
          target: 0.08
          response: 0.10
          max_delta: 0.04
          jitter: 0.005

      wind_speed:
        initial: 2.5
        bounds: [0.0, 35.0]
        units: m/s
        dynamics:
          method: bounded_inertial
          max_delta: 1.25
          jitter: 0.35
          inertia: 0.86
          max_velocity: 1.0

  water:
    description: Hydrology at the spillway.
    components:
      level:
        initial: 0.62
        bounds: [0.0, 1.0]
        units: normalized
        dynamics:
          method: bounded_inertial
          max_delta: 0.025
          jitter: 0.004
          inertia: 0.94

      flow_speed:
        initial: 0.34
        bounds: [0.0, 1.0]
        units: normalized
        dynamics:
          method: bounded_inertial
          max_delta: 0.05
          jitter: 0.008
          inertia: 0.88

      turbidity:
        initial: 0.18
        bounds: [0.0, 1.0]
        units: normalized
        dynamics:
          method: bounded_random_walk
          max_delta: 0.04
          jitter: 0.01
          drift: -0.002

  terrain:
    description: Spillway integrity and physical footing.
    components:
      dam_integrity:
        initial: 0.91
        bounds: [0.0, 1.0]
        units: fraction
        dynamics:
          method: bounded_random_walk
          max_delta: 0.03
          jitter: 0.002

      footing_stability:
        initial: 0.72
        bounds: [0.0, 1.0]
        units: normalized
        dynamics:
          method: bounded_inertial
          max_delta: 0.06
          jitter: 0.008
          inertia: 0.75

      dam_state:
        kind: discrete
        initial: intact
        states:
          - intact
          - strained
          - leaking
          - breached
          - collapsed
        transitions:
          intact:
            - to: strained
              event: dam_stressed
          strained:
            - to: leaking
              event: dam_damaged
          leaking:
            - to: breached
              event: dam_breached
          breached:
            - to: collapsed
              event: dam_collapsed

  ecology:
    description: Living systems that react more slowly than combat.
    components:
      frog_activity:
        initial: 0.82
        bounds: [0.0, 1.0]
        dynamics:
          method: bounded_target
          target: 0.78
          response: 0.12
          max_delta: 0.08
          jitter: 0.02

      fish_density:
        initial: 0.67
        bounds: [0.0, 1.0]
        dynamics:
          method: bounded_inertial
          max_delta: 0.05
          jitter: 0.01
          inertia: 0.80

roles:
  Reedshadow:
    combat_role: skirmisher
    preferred_range: close
    modifiers:
      stealth: 4
      underwater_attack: 3
      frontal_attack: -2
    abilities:
      - name: Submerged Flank
        kind: maneuver
        mechanics:
          approach: submerged
          positional_advantage: 0.35
          requires:
            - accessible_water
        visual_semantics:
          - low wake
          - brief emergence
          - minimal overt magic

      - name: Scale Seam
        kind: attack
        mechanics:
          targeting: vulnerable_seam
          damage_bias: precision
          range: close

  Shellbreaker:
    combat_role: frontline_striker
    preferred_range: melee
    modifiers:
      impact: 4
      grapple: 2
      stealth: -2
    abilities:
      - name: Hammerfall
        kind: attack
        mechanics:
          targeting: contact
          momentum: heavy
          weapon: stone_hammer
        visual_semantics:
          - physical contact
          - broad impact motion

  Holtwarden:
    combat_role: defender
    preferred_range: melee
    modifiers:
      brace: 5
      interception: 4
    abilities:
      - name: Hold the Line
        kind: reaction
        mechanics:
          intercepts: ally_threat
          redirects_force: true
          shield: root_and_plank
        visual_semantics:
          - shield physically between threat and ally

  Currentcaller:
    combat_role: control_caster
    preferred_range: mid
    modifiers:
      hydrodynamic_control: 5
    abilities:
      - name: Crosscurrent
        kind: spell
        mechanics:
          domain: hydrodynamic_control
          targeting: flow_region
          force_vector: 0.35
          ally_stability: 0.20
          enemy_stability: -0.15
        visual_semantics:
          - coherent water motion
          - flow direction may oppose gravity
          - luminous fish forms optional

  BubbleAugur:
    combat_role: information_support
    preferred_range: mid
    modifiers:
      pressure_sense: 5
      prediction: 3
    abilities:
      - name: Pressure Lattice
        kind: spell
        mechanics:
          domain: pressure_sensing
          targeting: water_volume
          reveals_motion: true
          ally_information_bonus: 0.25
        visual_semantics:
          - sparse large bubbles
          - concentric pressure rings
          - effect may be nearly invisible

  Cachekeeper:
    combat_role: battlefield_support
    preferred_range: flexible
    modifiers:
      salvage_use: 4
      ropework: 4
    abilities:
      - name: Snag Line
        kind: control
        mechanics:
          targeting: object_or_creature
          tether: true
          uses_environment_anchor: true
        visual_semantics:
          - taut rope
          - salvaged float or weight

