name: test

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run full macOS/Linux/Windows qualification"
        required: false
        default: true
        type: boolean

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  automatic:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip hatch
      - run: hatch run test

  full-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip hatch
      - run: hatch run test
      - run: hatch run build
      - run: hatch run install
      - run: dss paths --json
      - run: dss db status --json
