name: test

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python dev.py test
      - run: python dev.py package
      - run: python dev.py install
      - run: python -m dynamic_story_scaffold paths --json
      - run: python -m dynamic_story_scaffold db status --json
