name: test

on:
  pull_request:
    types: [opened]

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip hatch
      - run: |
          tmp=$(mktemp -d)
          export DSS_INSTALL_ROOT="$tmp/app"
          export DSS_BIN_DIR="$tmp/bin"
          export DYNAMIC_STORY_SCAFFOLD_DATA_DIR="$tmp/data"
          /bin/sh scripts/install.sh
          "$tmp/bin/dss" --help >/dev/null
          "$tmp/bin/dss-maintain" db status --json
