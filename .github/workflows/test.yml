name: test

on:
  pull_request:
    types: [opened]

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip hatch
      - run: hatch run build
      - run: hatch run dss install
