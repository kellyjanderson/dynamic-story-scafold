[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dynamic-story-scaffold"
version = "0.1.0"
description = "Bounded stochastic scene simulation for dynamic story generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20",
  "networkx>=3.4",
  "platformdirs>=4.3",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "typer>=0.19",
]

[project.scripts]
dss = "dynamic_story_scaffold.cli:app"
dss-maintain = "dynamic_story_scaffold.maintenance_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_story_scaffold"]

[tool.hatch.envs.default]
dependencies = [
  "GitPython>=3.1",
  "hypothesis>=6.120",
  "pytest>=8.3",
]

[tool.hatch.envs.default.scripts]
test = "pytest -q"
package = [
  "hatch build -c",
  "python scripts/record_build.py dist",
]
build = [
  "test",
  "package",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: narrow isolated behavior",
  "integration: cross-component/application behavior",
  "regression: previously fixed failure coverage",
]
